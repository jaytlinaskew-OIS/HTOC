[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htoc-ml"
version = "0.1.0"
description = "HTOC production forecasting and scoring models"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "openpyxl",
  "pytz",
  "xlsxwriter",
]

[project.scripts]
htoc-noi = "htoc.noi.__main__:main"
htoc-noi-daily-reports = "htoc.noi.daily_reports:main"
htoc-prism = "htoc.prism.__main__:main"
htoc-threat-score-iw = "htoc.datapipelines.threat_score_iw:main"
htoc-search-tags = "htoc.datapipelines.search_tags:main"
htoc-triage = "htoc.datapipelines.triage:main"
htoc-iw-listing = "htoc.datapipelines.iw_listing:main"
htoc-make-launcher = "htoc.datapipelines.make_launcher:main"

[project.optional-dependencies]
datapipelines = [
  "requests",
  "tabulate",
  "python-pptx",
  "pdfplumber",
]
datapipelines-ui = [
  "gradio>=4.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["htoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
